# Deploy the N02 Train Manager frontend to GitHub Pages as a STATIC site.
#
# The app normally runs on the Node/Express server in app/server.js, but GitHub
# Pages only serves static files. It works here anyway because the frontend
# degrades cleanly: the data APIs are just JSON files, a missing saved store
# falls back to built-in defaults, and the assemble step below flips the
# HAS_BACKEND flag to false so the backend-only calls (SSE live-refresh, server
# autosave/clear) are skipped entirely rather than 404-ing.
#
# What this workflow does on every push to main:
#   1. precomputes every train's route geometry offline (one part file per
#      train) so the phone never runs the route solver during page load;
#   2. copies app/public/ (the frontend) into _site/, minus the precompressed
#      *.gz sidecars (Pages gzips for us);
#   3. drops the datasets + train parts into _site/api/;
#   4. seeds _site/api/train-store with your real itinerary as the fallback
#      (see the SEED line below to change this);
#   5. publishes _site/ to Pages.
#
# ONE-TIME SETUP (in the repo on github.com):
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# After that, every push to main redeploys automatically. Live URL:
#   https://sager1145.github.io/Japan-Train-Map/

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Least-privilege token the Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pin Node so the build doesn't drift with the runner's default.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
        working-directory: app

      # Solve every train's route geometry OFFLINE (the script runs app.js's
      # own solver inside a Node vm) and emit app/data/sample-data/: a manifest
      # (with a per-date index) plus one part-NNN.json per train carrying its
      # precomputed geometry. train-store.json is only the SOURCE of this
      # sample dataset — user data on the static site lives in the browser
      # (IndexedDB). The frontend fetches and draws parts ONE TRAIN AT A TIME,
      # so the phone never builds the 600k-node route graphs nor runs
      # Dijkstra — that on-device cold solve (memory, not download size) is
      # what kept crashing iPhone Safari even after the gzip fix above.
      - name: Precompute sample data (per-train route parts)
        run: npm run precompute
        working-directory: app

      # Taiwan's sample is a FULLY SEPARATE dataset (api/sample-data-tw/),
      # generated from its own store. Its trains sit outside the N02 network,
      # so the precompute embeds the curated matched-routes geometry instead
      # of a solver result.
      - name: Precompute Taiwan sample data
        run: npm run precompute:tw
        working-directory: app

      # Hong Kong and Macao ship the same way: their own committed stores
      # (train-store-hk.json / train-store-mo.json) solved against their own
      # rail-sections/stations datasets into api/sample-data-hk|mo/. The
      # assemble step hard-fails if either manifest is missing.
      - name: Precompute Hong Kong and Macao sample data
        run: |
          npm run precompute:hk
          npm run precompute:mo
        working-directory: app

      # The two special-sample loops ship as their own datasets (the 資料 card
      # loads each on demand), so they need the same offline solve. Each npm
      # script runs its generator first, then precomputes into its own output
      # dir — app/package.json is the single owner of those command lines. The
      # assemble step below hard-fails if either manifest is missing.
      - name: Precompute special sample loops (New Year + Tokyo limited express)
        run: |
          npm run precompute:new-year-grand-loop
          npm run precompute:tokyo-limited-express-loop
        working-directory: app

      # AFTER precompute (the sample-data tests read the generated part
      # manifests, which are gitignored) but BEFORE assemble/deploy — a
      # regression fails the deploy instead of shipping to Pages, and the
      # suite also validates the parts this very run just generated.
      - name: Run tests
        run: npm test
        working-directory: app

      - name: Assemble static site
        # Copies the frontend without local gzip sidecars, publishes datasets
        # with .json extensions, includes the required precomputed sample data
        # (api/sample-data/), disables backend-only calls, and writes
        # .nojekyll. The same build is exercised by the local test suite.
        # No output arg: build-static-site.mjs defaults to <repo root>/_site,
        # the same path the upload step reads.
        run: npm run build:static
        working-directory: app

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (build type = GitHub Actions) on the first run,
          # using the workflow's pages:write token — so you don't have to flip
          # Settings -> Pages -> Source manually. No-op once Pages is enabled.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Pages can remain deployment_queued during a transient service
          # backlog. The action's 10-minute default canceled an otherwise
          # successful build, so allow the Pages backend more time to drain.
          timeout: 1800000
