# Deploy the N02 Train Manager frontend to GitHub Pages as a STATIC site.
#
# The app normally runs on the Node/Express server in app/server.js, but GitHub
# Pages only serves static files. It works here anyway because the frontend
# degrades cleanly: the data APIs are just JSON files, a missing saved store
# falls back to built-in defaults, and the SSE live-refresh no-ops when absent.
#
# What this workflow does on every push to main:
#   1. copies app/public/ (the frontend) into _site/, minus the precompressed
#      *.gz sidecars (Pages gzips for us);
#   2. drops the datasets into _site/api/<name> WITHOUT a .json extension, to
#      match how app.js fetches them (fetchJson("stations") -> ./api/stations);
#   3. seeds _site/api/train-store with your real itinerary so the live map
#      shows your trains (see the SEED line below to change this);
#   4. publishes _site/ to Pages.
#
# ONE-TIME SETUP (in the repo on github.com):
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# After that, every push to main redeploys automatically. Live URL:
#   https://sager1145.github.io/Japan-Train-Map/

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Least-privilege token the Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          # 1) Frontend, excluding *.gz sidecars. -L resolves any symlinks to
          #    real files.
          rsync -rL --exclude='*.gz' app/public/ _site/

          # 2) Datasets — served WITH a .json extension on purpose.
          #    GitHub Pages sets Content-Type from the file extension and only
          #    gzips a known type allow-list (text/*, application/json, ...).
          #    Extensionless files are sent as application/octet-stream, which
          #    Pages NEVER compresses — so rail-sections went over the wire as
          #    12 MB raw and stations as 3.3 MB raw, and parsing that much JSON
          #    at once is what made the browser report the tab as crashed.
          #    With a .json extension Pages gzips them (~2.4 MB / ~0.46 MB).
          mkdir -p _site/api
          cp app/data/rail-sections.json  _site/api/rail-sections.json
          cp app/data/stations.json       _site/api/stations.json
          cp app/data/default-trains.json _site/api/default-trains.json
          cp app/data/matched-routes.json _site/api/matched-routes.json
          cp app/data/matched-stops.json  _site/api/matched-stops.json

          # 3) SEED: publish your saved itinerary as the map's initial data.
          #    Delete this line to ship only the built-in demo trains instead.
          [ -f app/data/train-store.json ] && cp app/data/train-store.json _site/api/train-store.json || true

          # 4) Point the STATIC frontend copy at the .json dataset URLs. Local
          #    dev is untouched — app/server.js keeps serving the extensionless
          #    /api/<name> routes (it gzips them itself). Only this deployed
          #    _site/ copy is rewritten, by literal string replacement, so the
          #    source app.js/index.html you edit locally never changes.
          node -e '
            const fs = require("fs");
            let s = fs.readFileSync("_site/app.js", "utf8");
            s = s.split("`${API_BASE}/${path}`").join("`${API_BASE}/${path}.json`");
            s = s.split("`${API_BASE}/${TRAIN_STORE_API}`").join("`${API_BASE}/${TRAIN_STORE_API}.json`");
            fs.writeFileSync("_site/app.js", s);
            let h = fs.readFileSync("_site/index.html", "utf8");
            h = h.split("href=\"api/stations\"").join("href=\"api/stations.json\"");
            fs.writeFileSync("_site/index.html", h);
            console.log("Rewrote static frontend to fetch .json datasets");
          '

          # 5) Disable Jekyll so every file ships as-is.
          touch _site/.nojekyll

          echo "Assembled site:"; du -sh _site; find _site/api -maxdepth 1 -type f -printf '  %f\n'

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (build type = GitHub Actions) on the first run,
          # using the workflow's pages:write token — so you don't have to flip
          # Settings -> Pages -> Source manually. No-op once Pages is enabled.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
