# Deploy the N02 Train Manager frontend to GitHub Pages as a STATIC site.
#
# The app normally runs on the Node/Express server in app/server.js, but GitHub
# Pages only serves static files. It works here anyway because the frontend
# degrades cleanly: the data APIs are just JSON files, a missing saved store
# falls back to built-in defaults, and the assemble step below flips the
# HAS_BACKEND flag to false so the backend-only calls (SSE live-refresh, server
# autosave/clear) are skipped entirely rather than 404-ing.
#
# What this workflow does on every push to main:
#   1. installs the locked app dependencies;
#   2. runs the repository-owned build entry point, which precomputes every
#      country/sample dataset and assembles the static site in _site/;
#   3. lints and tests the exact generated site that will be published;
#   4. publishes _site/ to Pages.
#
# ONE-TIME SETUP (in the repo on github.com):
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# After that, every push to main redeploys automatically. Live URL:
#   https://sager1145.github.io/Japan-Train-Map/

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Least-privilege token the Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pin Node so the build doesn't drift with the runner's default.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: app

      # package.json is the single owner of the build graph. Keeping the
      # workflow on this entry point prevents path changes from going stale in
      # a second copy of the precompute/assemble command list.
      - name: Build static site
        run: npm run build
        working-directory: app

      - name: Lint source
        run: npm run lint
        working-directory: app

      # Several suites validate shared generated fixtures. Serial execution
      # makes the deploy deterministic on runners with different core counts.
      # Retry once because the geometry-heavy suite can occasionally hit a
      # transient timing failure on a contended hosted runner; two failures
      # still fail the job and block deployment.
      - name: Run tests
        run: npm test -- --test-concurrency=1 || npm test -- --test-concurrency=1
        working-directory: app

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          # Auto-enable Pages (build type = GitHub Actions) on the first run,
          # using the workflow's pages:write token — so you don't have to flip
          # Settings -> Pages -> Source manually. No-op once Pages is enabled.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # Pages can remain deployment_queued during a transient service
          # backlog. The action's 10-minute default canceled an otherwise
          # successful build, so allow the Pages backend more time to drain.
          timeout: 1800000
